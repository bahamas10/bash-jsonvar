name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Bash on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash

      - name: Check environment
        run: |
          type -a bash
          bash --version

      - name: Run tests
        run: ./run-tests
